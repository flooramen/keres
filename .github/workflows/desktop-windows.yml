name: Desktop Windows Installer

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/keres-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/keres-desktop
        run: npm ci

      - name: Build NSIS and MSI installers
        working-directory: apps/keres-desktop
        run: npm run build:windows

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: keres-desktop-windows-${{ github.sha }}
          path: |
            apps/keres-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/keres-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish tagged installers
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content "apps/keres-desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "desktop-v$version") {
            throw "Release tag $env:RELEASE_TAG does not match desktop version $version"
          }
          $assets = @(
            Get-ChildItem "apps/keres-desktop/src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object FullName
            Get-ChildItem "apps/keres-desktop/src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object FullName
          )
          if ($assets.Count -ne 2) {
            throw "Expected one NSIS setup executable and one MSI installer"
          }
          gh release create $env:RELEASE_TAG $assets --title $env:RELEASE_TAG --generate-notes
